<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Web Player Fullscreen</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-main: #0b0d12;
      --bg-card: #161a23;
      --bg-hover: #222836;
      --accent: #ff2a5f;
      --accent-glow: rgba(255, 42, 95, 0.4);
      --text-main: #ffffff;
      --text-muted: #8e95a5;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
    }

    /* Layout a Pantalla Completa */
    .tv-app {
      width: 100vw;
      min-height: 100vh;
      padding: clamp(12px, 2.5vw, 28px);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 2vw, 20px);
      background: radial-gradient(circle at top right, #181d2a 0%, var(--bg-main) 60%);
    }

    /* Buscador Superior */
    .search-box {
      position: relative;
      width: 100%;
      max-width: 500px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
    }

    /* Grid Principal */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(16px, 2vw, 24px);
      flex: 1;
    }

    .screen-placeholder {
      width: 100%;
      display: none;
    }
    .screen-placeholder.active {
      display: block;
    }

    /* Contenedor del Reproductor */
    .screen-wrapper {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      transition: all 0.3s ease;
    }

    .screen-header {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      pointer-events: none;
    }

    .channel-badge {
      font-size: 11px;
      font-weight: 600;
      background: rgba(15, 18, 25, 0.75);
      backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
      color: #fff;
      background: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background-color: #fff;
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0.2; transform: scale(0.7); }
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 16 / 9;
    }

    /* ESTILO VIDEO FLOTANTE */
    .screen-wrapper.floating {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 260px;
      z-index: 999;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 15px var(--accent-glow);
      animation: floatIn 0.3s ease forwards;
    }

    .screen-wrapper.floating .screen-header {
      padding: 4px;
    }

    @keyframes floatIn {
      from { transform: translateY(50px) scale(0.8); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Sidebar / Contenido */
    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    /* Filtro de Categorías */
    .categories-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .categories-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--text-main);
      color: #000;
      border-color: var(--text-main);
    }

    /* Lista de Canales */
    .channel-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .channel-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .channel-card:hover {
      background: var(--bg-hover);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .channel-card.active {
      background: linear-gradient(90deg, rgba(255, 42, 95, 0.15), transparent);
      border-color: var(--accent);
    }

    .channel-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .channel-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .channel-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .channel-name {
      font-size: 14px;
      font-weight: 600;
    }

    .channel-cat {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .play-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      fill: var(--text-main);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .channel-card.active .play-btn {
      background: var(--accent);
      fill: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .no-results {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      padding: 20px;
      display: none;
    }

    @media (min-width: 900px) {
      .main-layout {
        grid-template-columns: 1.8fr 1fr;
        align-items: start;
      }
      .channel-grid {
        max-height: calc(100vh - 160px);
        overflow-y: auto;
        padding-right: 4px;
      }
      .channel-grid::-webkit-scrollbar { width: 4px; }
      .channel-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    }

    @media (min-width: 600px) and (max-width: 899px) {
      .channel-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="tv-app">
    <!-- Buscador Superior -->
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24">
        <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Buscar canal...">
    </div>

    <!-- Layout Principal -->
    <div class="main-layout">
      
      <!-- Contenedor del Reproductor -->
      <div>
        <div id="screen-placeholder" class="screen-placeholder"></div>
        <div id="screen-wrapper" class="screen-wrapper">
          <div class="screen-header">
            <span class="channel-badge" id="channel-title">Cargando canales...</span>
            <div class="live-badge">
              <span class="live-dot"></span> LIVE
            </div>
          </div>
          <video id="video" controls autoplay muted playsinline></video>
        </div>
      </div>

      <!-- Sidebar con Filtros y Canales -->
      <div class="sidebar-section">
        <div class="categories-tabs" id="category-tabs">
          <button class="tab-btn active" data-category="Todos">Todos</button>
        </div>

        <div class="channel-grid" id="channel-grid"></div>
        <div class="no-results" id="no-results">No se encontraron canales</div>
      </div>

    </div>
  </div>

  <script type="module">

    const PLAYLIST_URL =
  '/playlist/tv_chile_2026_token_seguro_8f4Kp92x.m3u';
    const video = document.getElementById('video');
    const screenWrapper = document.getElementById('screen-wrapper');
    const screenPlaceholder = document.getElementById('screen-placeholder');
    const channelTitle = document.getElementById('channel-title');
    const channelGrid = document.getElementById('channel-grid');
    const searchInput = document.getElementById('search-input');
    const categoryTabs = document.getElementById('category-tabs');
    const noResults = document.getElementById('no-results');

    let channels = [];
    let hlsInstance = null;
    let activeChannelId = null;
    let selectedCategory = "Todos";

    // 1. Parser M3U
    function parseM3U(content) {
      const lines = content.split('\n');
      const parsedChannels = [];
      let currentChannel = {};

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const nameMatch = line.match(/,(.+)$/);
          const name = nameMatch ? nameMatch[1].trim() : 'Canal sin nombre';

          const groupMatch = line.match(/group-title="([^"]+)"/i);
          const category = groupMatch ? groupMatch[1].trim() : 'General';

          const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
          const logo = logoMatch ? logoMatch[1] : null;

          currentChannel = {
            name,
            category,
            icon: logo ? `<img src="${logo}" alt="logo" onerror="this.src=''; this.parentElement.innerHTML='📺'"/>` : '📺'
          };
        } else if (line.startsWith('http')) {
          if (currentChannel.name) {
            currentChannel.id = Math.random().toString(36).substr(2, 9);
            currentChannel.url = line;
            parsedChannels.push({ ...currentChannel });
            currentChannel = {};
          }
        }
      });

      return parsedChannels;
    }

    // 2. Cargar variables de entorno y listas M3U
    async function initApp() {
      const rawUrls = import.meta.env.VITE_M3U_URLS || "";
      const m3uUrls = rawUrls.split(',').map(url => url.trim()).filter(Boolean);

      if (m3uUrls.length === 0) {
        channelTitle.textContent = "Sin canales configurados";
        return;
      }

      const results = await Promise.all(
        m3uUrls.map(async (url) => {
          try {
            const res = await fetch(url);
            if (!res.ok) return [];
            const text = await res.text();
            return parseM3U(text);
          } catch (e) {
            console.error(`Error al cargar M3U desde ${url}:`, e);
            return [];
          }
        })
      );

      channels = results.flat();

      if (channels.length > 0) {
        buildCategoryTabs();
        activeChannelId = channels[0].id;
        channelTitle.textContent = channels[0].name;
        loadStream(channels[0].url);
        renderChannels();
      } else {
        channelTitle.textContent = "Error al cargar canales M3U";
      }
    }

    // 3. Generar pestañas de categorías automáticamente
    function buildCategoryTabs() {
      const categories = ['Todos', ...new Set(channels.map(c => c.category))];
      categoryTabs.innerHTML = categories.slice(0, 10).map(cat => 
        `<button class="tab-btn ${cat === 'Todos' ? 'active' : ''}" data-category="${cat}">${cat}</button>`
      ).join('');
    }

    // 4. Reproductor HLS
    function loadStream(url) {
      if (Hls.isSupported()) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(() => {});
      }
    }

    // 5. Renderizar lista de canales
    function renderChannels() {
      const query = searchInput.value.toLowerCase();
      channelGrid.innerHTML = '';

      const filtered = channels.filter(c => {
        const matchesCategory = selectedCategory === "Todos" || c.category === selectedCategory;
        const matchesSearch = c.name.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        noResults.style.display = 'block';
        return;
      }
      noResults.style.display = 'none';

      filtered.forEach(channel => {
        const card = document.createElement('div');
        card.className = `channel-card ${channel.id === activeChannelId ? 'active' : ''}`;
        
        card.innerHTML = `
          <div class="channel-info">
            <div class="channel-icon">${channel.icon}</div>
            <div>
              <div class="channel-name">${channel.name}</div>
              <div class="channel-cat">${channel.category}</div>
            </div>
          </div>
          <div class="play-btn">
            <svg width="10" height="10" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </div>
        `;

        card.addEventListener('click', () => {
          activeChannelId = channel.id;
          channelTitle.textContent = channel.name;
          loadStream(channel.url);
          renderChannels();
        });

        channelGrid.appendChild(card);
      });
    }

    // Intersection Observer (Video flotante)
    const observer = new IntersectionObserver((entries) => {
      if (window.innerWidth < 900) {
        const [entry] = entries;
        if (!entry.isIntersecting) {
          screenPlaceholder.style.height = `${screenWrapper.offsetHeight}px`;
          screenPlaceholder.classList.add('active');
          screenWrapper.classList.add('floating');
        } else {
          screenPlaceholder.classList.remove('active');
          screenWrapper.classList.remove('floating');
        }
      }
    }, { threshold: 0.2 });

    observer.observe(screenPlaceholder);

    // Eventos
    categoryTabs.addEventListener('click', (e) => {
      if (e.target.classList.contains('tab-btn')) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        selectedCategory = e.target.getAttribute('data-category');
        renderChannels();
      }
    });

    searchInput.addEventListener('input', renderChannels);

    // Inicializar
    initApp();
  </script>

</body>
</html>
