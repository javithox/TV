<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>PK TV — Estilos IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    .fullscreen-btn {
  position: absolute;
  right: 18px;
  bottom: 18px;
  z-index: 30;

  width: 50px;
  height: 50px;

  border: 1px solid rgba(255,255,255,.2);
  border-radius: 12px;

  background: rgba(0,0,0,.72);
  color: #fff;

  font-size: 27px;
  line-height: 1;

  cursor: pointer;
  backdrop-filter: blur(8px);

  transition:
    transform .2s,
    background .2s,
    opacity .2s;
}

.fullscreen-btn:hover {
  background: rgba(0,0,0,.9);
  transform: scale(1.05);
}

.fullscreen-btn:active {
  transform: scale(.95);
}

/* Cuando el reproductor está en pantalla completa */
.video-container:fullscreen {
  width: 100vw;
  height: 100vh;
  background: #000;
}

.video-container:-webkit-full-screen {
  width: 100vw;
  height: 100vh;
  background: #000;
}

.video-container:fullscreen video,
.video-container:-webkit-full-screen video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

@media (max-width: 700px) {
  .fullscreen-btn {
    right: 12px;
    bottom: 12px;
    width: 46px;
    height: 46px;
  }
}
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="video-container"><video id="video" playsinline webkit-playsinline preload="metadata"></video>

<button id="fullscreenBtn"
        class="fullscreen-btn focusable"
        type="button"
        aria-label="Pantalla completa">
  ⛶
</button></video></div>
    <header class="topbar">
      <button id="menuBtn" class="icon focusable" type="button" aria-label="Abrir canales"><span class="menu"></span></button>
      <div class="brand">PK TV <small>LIVE</small></div><div id="current" class="current"></div><div class="live"><i></i> EN VIVO</div>
    </header>
    <div id="status" class="status"><i></i><span>Cargando canales…</span></div><div id="overlay" class="overlay"></div>
    <aside id="sidebar" class="sidebar" aria-label="Lista de canales">
      <div class="sidebar-head"><div><span class="eyebrow">Biblioteca IPTV</span><h1>Canales TV</h1></div><button id="closeBtn" class="icon close focusable" type="button" aria-label="Cerrar">×</button></div>
      <label class="search"><span>⌕</span><input id="search" class="focusable" type="search" placeholder="Buscar canal…" autocomplete="off"></label>
      <div class="themes" aria-label="Elegir estilo"><button class="theme active focusable" data-theme="default">Rojo</button><button class="theme focusable" data-theme="glass">Glass</button><button class="theme focusable" data-theme="tv">Smart TV</button><button class="theme focusable" data-theme="anime">Anime</button><button class="theme focusable" data-theme="light">Claro</button></div>
      <div id="categories" class="categories" role="tablist" aria-label="Categorías"></div>
      <div id="count" class="count">Cargando…</div><div id="list" class="list"></div>
    </aside>
  </main>
<script>
'use strict';
const PLAYLIST_URL = '/playlist/tv_chile_2026_token_seguro_8f4Kp92x.m3u';
const $ = id => document.getElementById(id); const video=$('video'), list=$('list'), sidebar=$('sidebar'), overlay=$('overlay'), status=$('status'), statusText=status.querySelector('span'), current=$('current'), categoriesBox=$('categories');
let hls=null, channels=[], selected=null, selectedCategory='TODOS';
function showStatus(text,error=false,hide=false){statusText.textContent=text;status.classList.toggle('error',error);status.classList.toggle('hidden',hide)}
function parseM3U(text){const out=[];let info={};for(const raw of text.replace(/^\uFEFF/,'').split(/\r?\n/)){const line=raw.trim();if(!line)continue;if(line.toUpperCase().startsWith('#EXTINF')){const comma=line.indexOf(',');const meta=comma<0?line:line.slice(0,comma);info={title:comma<0?'Canal sin nombre':line.slice(comma+1).trim(),logo:meta.match(/tvg-logo="([^"]*)"/i)?.[1]||'',group:meta.match(/group-title="([^"]*)"/i)?.[1]||'General'};continue}if(/^https?:\/\//i.test(line)){out.push({id:`channel-${out.length+1}`,title:info.title||`Canal ${out.length+1}`,logo:info.logo,group:info.group,url:line});info={}}}return out}
function renderCategories(){categoriesBox.replaceChildren();const groups=[...new Set(channels.map(c=>(c.group||'GENERAL').trim()))].sort((a,b)=>a.localeCompare(b,'es'));['TODOS',...groups].forEach(group=>{const button=document.createElement('button');button.className=`category focusable ${selectedCategory===group?'active':''}`;button.type='button';button.textContent=group;button.onclick=()=>{selectedCategory=group;renderCategories();render()};categoriesBox.append(button)})}
	function render(){const term=$('search').value.toLocaleLowerCase('es').trim();const filtered=channels.filter(c=>{const matchesCategory=selectedCategory==='TODOS'||(c.group||'GENERAL').trim()===selectedCategory;const matchesSearch=`${c.title} ${c.group}`.toLocaleLowerCase('es').includes(term);return matchesCategory&&matchesSearch});$('count').textContent=`${filtered.length} de ${channels.length} canales`;list.replaceChildren();if(!filtered.length){list.innerHTML='<div class="count">No se encontraron canales.</div>';return}const frag=document.createDocumentFragment();filtered.forEach(channel=>{const btn=document.createElement('button');btn.className=`channel focusable ${selected?.id===channel.id?'active':''}`;btn.type='button';if(channel.logo){const img=document.createElement('img');img.className='logo';img.src=channel.logo;img.alt='';img.onerror=()=>img.replaceWith(fallbackLogo());btn.append(img)}else btn.append(fallbackLogo());const copy=document.createElement('span');copy.className='copy';copy.innerHTML=`<b></b><small></small>`;copy.firstChild.textContent=channel.title;copy.lastChild.textContent=channel.group||'General';btn.append(copy);if(selected?.id===channel.id)btn.insertAdjacentHTML('beforeend','<span class="bars" aria-label="Reproduciendo"><i></i><i></i><i></i></span>');btn.onclick=()=>play(channel);frag.append(btn)});list.append(frag)}
function fallbackLogo(){const el=document.createElement('span');el.className='logo no-logo';el.textContent='TV';return el}
function clearVideo(){if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute('src');video.load()}
function play(channel){if(!channel)return;selected=channel;current.textContent=channel.title;render();showStatus(`Cargando ${channel.title}…`);clearVideo();const url=channel.url;if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.play().catch(()=>showStatus('Presiona reproducir para iniciar'));return}if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:30});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>showStatus('Presiona reproducir para iniciar')));hls.on(Hls.Events.ERROR,(_,data)=>{if(!data.fatal)return;if(data.type===Hls.ErrorTypes.NETWORK_ERROR)hls.startLoad();else if(data.type===Hls.ErrorTypes.MEDIA_ERROR)hls.recoverMediaError();else showStatus('Canal no disponible',true)});return}video.src=url;video.play().catch(()=>showStatus('Formato no compatible',true))}
async function load(){showStatus('Cargando canales…');try{const response=await fetch(PLAYLIST_URL,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);channels=parseM3U(await response.text());renderCategories();render();if(channels.length)play(channels[0]);else showStatus('Lista vacía',true)}catch(error){console.error(error);showStatus('Error al cargar la playlist',true);$('count').textContent='No se pudo cargar la lista'}}
$('menuBtn').onclick=()=>{sidebar.classList.add('open');overlay.classList.add('show');setTimeout(()=>$('search').focus(),120)};$('closeBtn').onclick=close;overlay.onclick=close;function close(){sidebar.classList.remove('open');overlay.classList.remove('show');$('menuBtn').focus()}$('search').oninput=render;document.querySelectorAll('.theme').forEach(btn=>btn.onclick=()=>{document.documentElement.dataset.theme=btn.dataset.theme==='default'?'':btn.dataset.theme;document.querySelectorAll('.theme').forEach(x=>x.classList.toggle('active',x===btn))});document.addEventListener('keydown',e=>{if((e.key==='Escape'||e.key==='Backspace'||e.keyCode===10009)&&sidebar.classList.contains('open')){e.preventDefault();close()}});video.addEventListener('playing',()=>showStatus('Reproduciendo',false,true));video.addEventListener('waiting',()=>showStatus('Cargando señal…'));video.addEventListener('error',()=>showStatus('No se pudo reproducir la señal',true));load();
</script>
</body>
</html>
