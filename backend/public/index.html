<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <meta name="color-scheme" content="dark">
  <title>PK TV - Smart TV Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --red: #e50914;
      --red-focus: #ff333e;
      --surface: #15171d;
      --surface-2: #20232b;
      --text: #f7f7f8;
      --muted: #a5a8b1;
      font-family: Roboto, "Noto Sans", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; color: var(--text); overflow: hidden; }
    button, input { font: inherit; }
    button { color: inherit; }

    .app { position: relative; width: 100vw; height: 100vh; background: #000; }
    .video-container { position: absolute; inset: 0; display: grid; place-items: center; background: #000; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; }

    /* Topbar */
    .topbar {
      position: absolute; inset: 0 0 auto; z-index: 20;
      display: flex; align-items: center; gap: 15px; min-height: 80px; padding: 20px 30px;
      background: linear-gradient(180deg, rgba(0,0,0,.92), rgba(0,0,0,0));
      pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }
    .title { font-size: 26px; font-weight: 800; text-shadow: 0 2px 6px #000; }
    .current-channel { margin-left: 10px; color: #c5c7cc; font-size: 18px; text-shadow: 0 2px 5px #000; }

    /* Botones y Foco para TV */
    .icon-btn {
      display: inline-grid; place-items: center; width: 50px; height: 50px; flex: 0 0 50px;
      padding: 0; border: 2px solid transparent; border-radius: 12px;
      background: rgba(29,31,38,.92); color: #fff; cursor: pointer;
    }
    
    /* EFECTO DE FOCO PARA CONTROL REMOTO DE TV */
    :focus-visible, .focusable:focus {
      outline: none !important;
      border: 3px solid var(--red-focus) !important;
      background: var(--surface-2) !important;
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.8) !important;
      transform: scale(1.05);
      transition: transform 0.15s ease, border 0.15s ease;
    }

    .menu-icon { position: relative; width: 22px; height: 16px; border-top: 2px solid currentColor; border-bottom: 2px solid currentColor; }
    .menu-icon::after { content: ""; position: absolute; left: 0; right: 0; top: 5px; border-top: 2px solid currentColor; }

    /* Status Bar */
    .status {
      position: absolute; left: 50%; bottom: 40px; z-index: 15;
      padding: 10px 20px; border-radius: 999px; background: rgba(0,0,0,.85);
      color: #d1d3d8; font-size: 16px; text-align: center; transform: translateX(-50%);
      transition: opacity .25s ease; pointer-events: none;
    }
    .status.error { color: #ff8d95; }
    .status.hidden { opacity: 0; }

    /* Overlay & Sidebar */
    .overlay { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.75); opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease; }
    .overlay.show { opacity: 1; visibility: visible; }
    
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 100;
      display: flex; flex-direction: column; width: 440px; height: 100vh;
      background: #111318; box-shadow: 10px 0 40px rgba(0,0,0,.8);
      transform: translateX(-100%); transition: transform .25s cubic-bezier(.2,.75,.25,1);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 20px; border-bottom: 1px solid #2b2e37; }
    .sidebar-title { font-size: 22px; font-weight: 800; }
    .close-btn { width: 46px; height: 46px; font-size: 26px; }

    .search-box { padding: 15px 20px 10px; }
    .search-box input {
      width: 100%; height: 50px; padding: 0 15px; border: 2px solid #393d48;
      border-radius: 12px; background: #242730; color: #fff; font-size: 18px; outline: 0;
    }

    /* BARRA DE CATEGORÍAS */
    .categories-bar {
      display: flex; gap: 8px; overflow-x: auto; padding: 5px 20px 10px;
      scrollbar-width: none; white-space: nowrap; flex-shrink: 0;
    }
    .categories-bar::-webkit-scrollbar { display: none; }
    
    .category-btn {
      padding: 8px 16px; border-radius: 20px; border: 1px solid #393d48;
      background: #1c1f26; color: #c5c7cc; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .category-btn.active {
      background: var(--red); color: #fff; border-color: var(--red);
    }

    .channel-count { padding: 0 20px 10px; color: var(--muted); font-size: 14px; }
    .channel-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 15px 20px; scrollbar-width: none; }
    .channel-list::-webkit-scrollbar { display: none; }

    /* Item de Canal */
    .channel {
      display: flex; align-items: center; width: 100%; min-height: 64px; gap: 15px;
      margin-bottom: 8px; padding: 10px 14px; border: 2px solid transparent; border-radius: 12px;
      background: transparent; text-align: left; cursor: pointer; color: #fff;
    }
    .channel.active { background: var(--red); }
    .channel-logo { width: 46px; height: 46px; flex: 0 0 46px; padding: 4px; border-radius: 8px; object-fit: contain; background: #fff; }
    .channel-logo.no-logo { display: grid; place-items: center; padding: 0; background: #30343e; font-size: 18px; font-weight: bold; }
    .channel-name { font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { padding: 40px 20px; color: #9b9ea7; text-align: center; font-size: 18px; }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="video-container">
      <video id="video" playsinline preload="metadata"></video>
    </div>

    <header class="topbar">
      <button id="menuBtn" class="icon-btn focusable" type="button" aria-label="Abrir Canales">
        <span class="menu-icon"></span>
      </button>
      <div class="title">PK TV</div>
      <div id="currentChannel" class="current-channel"></div>
    </header>

    <div id="status" class="status">Cargando canales...</div>
    <div id="overlay" class="overlay"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Canales TV</div>
        <button id="closeBtn" class="icon-btn close-btn focusable" type="button">×</button>
      </div>

      <div class="search-box">
        <input id="searchInput" class="focusable" type="search" placeholder="Buscar canal..." autocomplete="off">
      </div>

      <!-- Contenedor dinámico de Categorías -->
      <div id="categoriesBar" class="categories-bar"></div>

      <div id="channelCount" class="channel-count">Cargando...</div>
      <div id="channelList" class="channel-list"></div>
    </aside>
  </main>

  <script>
    "use strict";

    const PLAYLIST_URL = "/playlist/tv_chile_2026_token_seguro_8f4Kp92x.m3u";
    let hls = null;
    let canales = [];
    let canalActual = null;
    let categoriaSeleccionada = "TODOS";

    const $ = (id) => document.getElementById(id);
    const video = $("video");
    const sidebar = $("sidebar");
    const overlay = $("overlay");
    const menuBtn = $("menuBtn");
    const closeBtn = $("closeBtn");
    const searchInput = $("searchInput");
    const categoriesBar = $("categoriesBar");
    const channelList = $("channelList");
    const channelCount = $("channelCount");
    const status = $("status");
    const currentChannel = $("currentChannel");

    window.addEventListener("DOMContentLoaded", () => {
      menuBtn.focus();
    });

    function abrirPanel() {
      sidebar.classList.add("open");
      overlay.classList.add("show");
      setTimeout(() => searchInput.focus(), 100);
    }

    function cerrarPanel() {
      sidebar.classList.remove("open");
      overlay.classList.remove("show");
      menuBtn.focus();
    }

    menuBtn.addEventListener("click", abrirPanel);
    closeBtn.addEventListener("click", cerrarPanel);
    overlay.addEventListener("click", cerrarPanel);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" || e.key === "Backspace" || e.keyCode === 10009 || e.keyCode === 27) {
        if (sidebar.classList.contains("open")) {
          e.preventDefault();
          cerrarPanel();
        }
      }
      if (e.key === "Enter" && document.activeElement === document.body) {
        menuBtn.focus();
      }
    });

    function mostrarEstado(mensaje, error = false, ocultar = false) {
      status.textContent = mensaje;
      status.classList.toggle("error", error);
      status.classList.toggle("hidden", ocultar);
    }

    function parsearM3U(text) {
      const resultado = [];
      let info = {};
      for (const rawLine of text.split(/\r?\n/)) {
        const linea = rawLine.trim();
        if (!linea) continue;
        if (linea.toUpperCase().startsWith("#EXTINF:")) {
          const coma = linea.indexOf(",");
          const metadata = coma >= 0 ? linea.slice(0, coma) : linea;
          info.nombre = coma >= 0 ? linea.slice(coma + 1).trim() : "Canal sin nombre";
          info.logo = metadata.match(/tvg-logo="([^"]*)"/i)?.[1] || "";
          info.grupo = metadata.match(/group-title="([^"]*)"/i)?.[1] || "VARIOS";
          continue;
        }
        if (/^https?:\/\//i.test(linea)) {
          resultado.push({ 
            nombre: info.nombre || `Canal ${resultado.length + 1}`, 
            logo: info.logo || "", 
            grupo: info.grupo ? info.grupo.trim().toUpperCase() : "VARIOS", 
            url: linea 
          });
          info = {};
        }
      }
      return resultado;
    }

    // Renderiza los botones de categorías dinámicamente
    function renderCategorias() {
      categoriesBar.replaceChildren();

      const grupos = Array.from(new Set(canales.map(c => c.grupo))).sort();
      const listaCategorias = ["TODOS", ...grupos];

      const fragment = document.createDocumentFragment();

      listaCategorias.forEach((cat) => {
        const btn = document.createElement("button");
        btn.className = `category-btn focusable ${categoriaSeleccionada === cat ? "active" : ""}`;
        btn.type = "button";
        btn.textContent = cat;

        btn.addEventListener("focus", () => {
          btn.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
        });

        btn.addEventListener("click", () => {
          categoriaSeleccionada = cat;
          document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          renderCanales(filtrarCanalesActuales());
        });

        fragment.appendChild(btn);
      });

      categoriesBar.appendChild(fragment);
    }

    function renderCanales(lista) {
      channelList.replaceChildren();
      channelCount.textContent = `${lista.length} ${lista.length === 1 ? "canal" : "canales"}`;
      if (!lista.length) { channelList.innerHTML = '<div class="empty">No se encontraron canales</div>'; return; }

      const fragment = document.createDocumentFragment();
      lista.forEach((canal) => {
        const button = document.createElement("button");
        button.className = "channel focusable";
        button.type = "button";
        if (canalActual?.url === canal.url) { button.classList.add("active"); }

        if (canal.logo) {
          const img = document.createElement("img");
          img.className = "channel-logo";
          img.src = canal.logo;
          img.alt = "";
          img.onerror = () => { img.replaceWith(crearLogoAlternativo()); };
          button.appendChild(img);
        } else button.appendChild(crearLogoAlternativo());

        const name = document.createElement("span");
        name.className = "channel-name";
        name.textContent = canal.nombre;
        button.appendChild(name);

        button.addEventListener("focus", () => {
          button.scrollIntoView({ block: "nearest", behavior: "smooth" });
        });

        button.addEventListener("click", () => { reproducirCanal(canal); cerrarPanel(); });
        fragment.appendChild(button);
      });
      channelList.appendChild(fragment);
    }

    function crearLogoAlternativo() {
      const logo = document.createElement("span");
      logo.className = "channel-logo no-logo";
      logo.textContent = "TV";
      return logo;
    }

    let searchTimeout;
    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        renderCanales(filtrarCanalesActuales());
      }, 200);
    });

    // Filtra aplicando categoría Y texto del buscador al mismo tiempo
    function filtrarCanalesActuales() {
      const termino = searchInput.value.toLocaleLowerCase("es").trim();
      return canales.filter((canal) => {
        const coincideCategoria = (categoriaSeleccionada === "TODOS") || (canal.grupo === categoriaSeleccionada);
        const coincideTexto = !termino || `${canal.nombre} ${canal.grupo}`.toLocaleLowerCase("es").includes(termino);
        return coincideCategoria && coincideTexto;
      });
    }

    async function cargarPlaylist() {
      mostrarEstado("Cargando canales...");
      try {
        const response = await fetch(PLAYLIST_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        canales = parsearM3U(await response.text());
        
        renderCategorias();
        renderCanales(canales);

        if (!canales.length) { mostrarEstado("No se encontraron canales", true); return; }
        mostrarEstado(`${canales.length} canales listos`);
        reproducirCanal(canales[0]);
      } catch (error) {
        console.error(error);
        channelList.innerHTML = '<div class="empty">Error al cargar la lista.</div>';
        mostrarEstado("Error al cargar la playlist", true);
      }
    }

    function limpiarReproductor() {
      if (hls) { hls.destroy(); hls = null; }
      video.pause();
      video.removeAttribute("src");
      video.load();
    }

    function reproducirCanal(canal) {
      if (!canal || (canalActual?.url === canal.url && !video.paused)) return;
      canalActual = canal;
      currentChannel.textContent = canal.nombre;
      renderCanales(filtrarCanalesActuales());
      mostrarEstado(`Cargando ${canal.nombre}...`);
      limpiarReproductor();

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = canal.url;
        video.play().catch(() => mostrarEstado("Presiona OK para reproducir"));
        return;
      }

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(canal.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().then(() => mostrarEstado("Reproduciendo", false, true)).catch(() => mostrarEstado("Presiona OK para reproducir"));
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { hls.startLoad(); }
          else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); }
          else { mostrarEstado("Canal no disponible.", true); hls.destroy(); }
        });
        return;
      }
      mostrarEstado("El navegador no soporta HLS.", true);
    }

    video.addEventListener("playing", () => mostrarEstado("Reproduciendo", false, true));
    video.addEventListener("waiting", () => mostrarEstado("Cargando señal..."));
    video.addEventListener("error", () => mostrarEstado("No se pudo reproducir la señal.", true));

    cargarPlaylist();
  </script>
</body>
</html>
