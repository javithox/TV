<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d12">
  <title>Smart TV Web Player Fullscreen</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg-main: #0b0d12;
      --bg-card: #161a23;
      --bg-hover: #222836;
      --accent: #ff2a5f;
      --accent-glow: rgba(255, 42, 95, 0.4);
      --text-main: #ffffff;
      --text-muted: #8e95a5;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg-main);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
    }

    .tv-app {
      width: 100%;
      min-height: 100vh;
      padding: clamp(12px, 2.5vw, 28px);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 2vw, 20px);
      background:
        radial-gradient(
          circle at top right,
          #181d2a 0%,
          var(--bg-main) 60%
        );
    }

    /* Buscador */

    .search-box {
      position: relative;
      width: 100%;
      max-width: 500px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .source-form {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 760px;
    }

    .source-form .search-input {
      max-width: none;
      min-width: 0;
    }

    .source-button {
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      min-height: 42px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s ease;
    }

    .source-button:hover {
      opacity: 0.9;
    }

    .source-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .source-status {
      min-height: 18px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    /* Layout */

    .main-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(16px, 2vw, 24px);
      flex: 1;
    }

    /* Sentinel */

    .screen-placeholder {
      width: 100%;
      height: 1px;
      display: block;
      pointer-events: none;
    }

    /* Reproductor */

    .screen-wrapper {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      transition: all 0.3s ease;
    }

    .screen-header {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 2;
      pointer-events: none;
    }

    .channel-badge {
      max-width: 70%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 600;
      background: rgba(15, 18, 25, 0.75);
      backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
      color: #fff;
      background: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 0 12px var(--accent-glow);
      flex-shrink: 0;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background-color: #fff;
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 1;
        transform: scale(1);
      }

      to {
        opacity: 0.2;
        transform: scale(0.7);
      }
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    /* Video flotante */

    .screen-wrapper.floating {
      position: fixed;
      left: auto;
      top: auto;
      bottom: 16px;
      right: 16px;
      width: min(300px, calc(100vw - 32px));
      z-index: 9999;
      border-radius: 14px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.9),
        0 0 15px var(--accent-glow);
      animation: none !important;
      transform: none !important;
      transition: none !important;
    }

    .screen-wrapper.floating .screen-header {
      top: 8px;
      left: 8px;
      right: 8px;
    }

    .screen-wrapper.floating video {
      display: block;
    }

    /* Sidebar */

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    /* Categorías */

    .categories-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active,
    .tab-btn:hover,
    .tab-btn:focus-visible {
      background: var(--text-main);
      color: #000;
      border-color: var(--text-main);
      outline: none;
    }

    /* Lista */

    .channel-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      max-height: min(58vh, 620px);
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .channel-grid::-webkit-scrollbar {
      width: 5px;
    }

    .channel-grid::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 999px;
    }

    .scroll-control {
      align-self: flex-start;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.06);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .scroll-control:hover,
    .scroll-control:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .channel-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .channel-card:hover {
      background: var(--bg-hover);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .channel-card.active {
      background:
        linear-gradient(
          90deg,
          rgba(255, 42, 95, 0.15),
          transparent
        );
      border-color: var(--accent);
    }

    .channel-info {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .channel-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
      overflow: hidden;
    }

    .channel-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .channel-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-cat {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .play-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      fill: var(--text-main);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .channel-card.active .play-btn {
      background: var(--accent);
      fill: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .no-results {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      padding: 20px;
      display: none;
    }

    @media (min-width: 900px) {
      .main-layout {
        grid-template-columns: 1.8fr 1fr;
        align-items: start;
      }

      .channel-grid {
        max-height: calc(100vh - 160px);
        padding-right: 4px;
      }
    }

    @media (min-width: 600px) and (max-width: 899px) {
      .channel-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .source-form {
        flex-direction: column;
      }

      .source-button {
        width: 100%;
      }

      .screen-wrapper.floating {
        width: min(260px, calc(100vw - 32px));
      }
    }
  </style>

</head>

  <script>
    "use strict";

    /*
     * CONFIGURACIÓN
     *
     * PLAYLIST_URL:
     * Playlist M3U que tu backend sirve automáticamente.
     *
     * USER_TOKEN:
     * Token utilizado por /api/sources.
     */

    const PLAYLIST_URL =
      "/playlist/tv_chile_2026_token_seguro_8f4Kp92x.m3u";

    const USER_TOKEN =
      "tv_chile_2026_token_seguro_8f4Kp92x";


    /* Elementos */

    const video =
      document.getElementById("video");

    const screenWrapper =
      document.getElementById("screen-wrapper");

    const screenPlaceholder =
      document.getElementById("screen-placeholder");

    const channelTitle =
      document.getElementById("channel-title");

    const channelGrid =
      document.getElementById("channel-grid");

    const searchInput =
      document.getElementById("search-input");

    const categoryTabs =
      document.getElementById("category-tabs");

    const noResults =
      document.getElementById("no-results");

    const scrollToggle =
      document.getElementById("scroll-toggle");

    const sourceForm =
      document.getElementById("source-form");

    const sourceUrl =
      document.getElementById("source-url");

    const sourceButton =
      document.getElementById("source-button");

    const sourceStatus =
      document.getElementById("source-status");


    /* Estado */

    let channels = [];

    let hlsInstance = null;

    let activeChannelId = null;

    let selectedCategory = "TODOS";

    let autoScrollEnabled = true;

    let autoScrollFrame = 0;

    let lastScrollTime = 0;

    let isFloating = false;

    let observer = null;


    /* Auto-scroll */

    function updateScrollButton() {
      scrollToggle.textContent =
        autoScrollEnabled
          ? "Pausar auto-scroll"
          : "Reanudar auto-scroll";

      scrollToggle.setAttribute(
        "aria-pressed",
        String(!autoScrollEnabled)
      );
    }


    function autoScroll(timestamp) {

      if (
        timestamp - lastScrollTime > 40 &&
        autoScrollEnabled
      ) {

        const atEnd =
          channelGrid.scrollTop +
          channelGrid.clientHeight >=
          channelGrid.scrollHeight - 2;

        channelGrid.scrollTop =
          atEnd
            ? 0
            : channelGrid.scrollTop + 1;

        lastScrollTime = timestamp;
      }

      autoScrollFrame =
        window.requestAnimationFrame(autoScroll);
    }


    /* Seguridad */

    function escapeHtml(value) {

      return String(value ?? "").replace(
        /[&<>"']/g,
        char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char])
      );
    }


    /* Parser M3U */

    function parseM3U(text) {

      const out = [];

      let info = {};

      const lines =
        String(text)
          .replace(/^\uFEFF/, "")
          .split(/\r?\n/);


      for (const raw of lines) {

        const line = raw.trim();

        if (!line) {
          continue;
        }


        /*
         * EXTINF
         *
         * Ejemplo:
         *
         * #EXTINF:-1 tvg-logo="logo.jpg"
         * group-title="ANIME",DragonBall Super EP 02
         */

        if (
          line
            .toUpperCase()
            .startsWith("#EXTINF")
        ) {

          const comma =
            line.indexOf(",");

          const meta =
            comma < 0
              ? line
              : line.slice(0, comma);

          const title =
            comma < 0
              ? "Canal sin nombre"
              : line.slice(comma + 1).trim();


          const logoMatch =
            meta.match(
              /tvg-logo="([^"]*)"/i
            );

          const groupMatch =
            meta.match(
              /group-title="([^"]*)"/i
            );


          info = {
            title:
              title || "Canal sin nombre",

            logo:
              logoMatch
                ? logoMatch[1]
                : "",

            group:
              groupMatch
                ? groupMatch[1]
                : "GENERAL"
          };

          continue;
        }


        /*
         * Ignorar comentarios M3U
         */

        if (line.startsWith("#")) {
          continue;
        }


        /*
         * Aceptar URLs HTTP/HTTPS.
         *
         * Esto permite:
         * .m3u8
         * .mp4
         * .ts
         * streams HTTP
         */

        if (/^https?:\/\//i.test(line)) {

          out.push({

            id:
              `channel-${out.length + 1}`,

            title:
              info.title ||
              `Canal ${out.length + 1}`,

            logo:
              info.logo || "",

            group:
              info.group || "GENERAL",

            url:
              line
          });


          info = {};
        }
      }


      return out;
    }


    /* Destruir reproductor HLS */

    function destroyHls() {

      if (hlsInstance) {

        try {
          hlsInstance.destroy();
        } catch (error) {
          console.warn(
            "Error destruyendo HLS:",
            error
          );
        }

        hlsInstance = null;
      }
    }


    /* Reproducir canal */

    function playChannel(channel) {

      if (!channel) {
        return;
      }


      activeChannelId =
        channel.id;

      channelTitle.textContent =
        channel.title;


      destroyHls();


      video.pause();

      video.removeAttribute("src");

      video.load();


      const url =
        channel.playbackUrl ||
        channel.url;


      if (!url) {

        channelTitle.textContent =
          "URL no disponible";

        return;
      }


      /*
       * Safari / iOS / navegadores con
       * soporte HLS nativo.
       */

      if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        video.src = url;

        video.play().catch(() => {});

        return;
      }


      /*
       * HLS.js
       */

      if (
        window.Hls &&
        Hls.isSupported()
      ) {

        hlsInstance =
          new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            maxBufferLength: 30
          });


        hlsInstance.loadSource(url);

        hlsInstance.attachMedia(video);


        hlsInstance.on(
          Hls.Events.MANIFEST_PARSED,
          () => {
            video
              .play()
              .catch(() => {});
          }
        );


        hlsInstance.on(
          Hls.Events.ERROR,
          (_event, data) => {

            if (!data.fatal) {
              return;
            }


            console.error(
              "Error HLS:",
              data
            );


            if (
              data.type ===
              Hls.ErrorTypes.NETWORK_ERROR
            ) {

              channelTitle.textContent =
                "Reconectando...";

              try {
                hlsInstance.startLoad();
              } catch (_) {}

              return;
            }


            if (
              data.type ===
              Hls.ErrorTypes.MEDIA_ERROR
            ) {

              try {
                hlsInstance.recoverMediaError();
              } catch (_) {}

              return;
            }


            channelTitle.textContent =
              "Canal no disponible";

            destroyHls();
          }
        );

        return;
      }


      /*
       * Fallback para MP4 y otros formatos
       * soportados directamente por <video>.
       */

      video.src = url;

      video.play().catch(() => {});
    }


    /* Crear categorías */

    function buildCategoryTabs() {

      const groups = [
        ...new Set(
          channels.map(
            channel =>
              (channel.group || "GENERAL")
                .trim()
          )
        )
      ]
      .filter(Boolean)
      .sort(
        (a, b) =>
          a.localeCompare(b, "es")
      );


      const categories =
        ["TODOS", ...groups];


      categoryTabs.innerHTML =
        categories
          .map(
            category => `
              <button
                type="button"
                class="tab-btn ${
                  category === selectedCategory
                    ? "active"
                    : ""
                }"
                data-category="${escapeHtml(category)}"
              >
                ${escapeHtml(category)}
              </button>
            `
          )
          .join("");
    }


    /* Renderizar canales */

    function renderChannels() {

      const query =
        searchInput.value
          .toLowerCase()
          .trim();


      channelGrid.innerHTML = "";


      const filtered =
        channels.filter(channel => {

          const group =
            (channel.group || "GENERAL")
              .trim();


          const matchesCategory =
            selectedCategory === "TODOS" ||
            group === selectedCategory;


          const searchText =
            `${channel.title} ${group}`
              .toLowerCase();


          const matchesSearch =
            searchText.includes(query);


          return (
            matchesCategory &&
            matchesSearch
          );
        });


      if (filtered.length === 0) {

        noResults.style.display =
          "block";

        return;
      }


      noResults.style.display =
        "none";


      filtered.forEach(channel => {

        const card =
          document.createElement("div");


        card.className =
          `channel-card ${
            channel.id === activeChannelId
              ? "active"
              : ""
          }`;


        card.setAttribute(
          "role",
          "button"
        );

        card.setAttribute(
          "tabindex",
          "0"
        );

        card.setAttribute(
          "aria-label",
          `Reproducir ${channel.title}`
        );


        let logoHTML = "TV";


        if (channel.logo) {

          logoHTML = `
            <img
              src="${escapeHtml(channel.logo)}"
              alt=""
              loading="lazy"
            >
          `;
        }


        card.innerHTML = `
          <div class="channel-info">

            <div class="channel-icon">
              ${logoHTML}
            </div>

            <div>

              <div class="channel-name">
                ${escapeHtml(channel.title)}
              </div>

              <div class="channel-cat">
                ${escapeHtml(
                  channel.group || "General"
                )}
              </div>

            </div>

          </div>

          <div class="play-btn">

            <svg
              width="10"
              height="10"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M8 5v14l11-7z"/>
            </svg>

          </div>
        `;


        const img =
          card.querySelector("img");


        if (img) {

          img.addEventListener(
            "error",
            () => {
              const parent =
                img.parentElement;

              if (parent) {
                parent.textContent =
                  "TV";
              }
            },
            { once: true }
          );
        }


        const selectChannel =
          () => {

            playChannel(channel);

            renderChannels();
          };


        card.addEventListener(
          "click",
          selectChannel
        );


        card.addEventListener(
          "keydown",
          event => {

            if (
              event.key === "Enter" ||
              event.key === " "
            ) {

              event.preventDefault();

              selectChannel();
            }
          }
        );


        channelGrid.appendChild(card);
      });
    }


    /* Cargar playlist */

    async function initApp() {

      try {

        channelTitle.textContent =
          "Cargando canales...";


        const response =
          await fetch(
            PLAYLIST_URL,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );
        }


        const m3uText =
          await response.text();


        channels =
          parseM3U(m3uText);


        if (channels.length > 0) {

          selectedCategory =
            "TODOS";

          buildCategoryTabs();


          activeChannelId =
            channels[0].id;


          renderChannels();


          playChannel(
            channels[0]
          );

        } else {

          channelTitle.textContent =
            "Lista vacía";

          noResults.style.display =
            "block";
        }

      } catch (error) {

        console.error(
          "Error al cargar playlist:",
          error
        );


        channelTitle.textContent =
          "Error al cargar la lista";


        sourceStatus.textContent =
          `No se pudo cargar la playlist: ${
            error.message
          }`;
      }
    }


    /* Player flotante Android */

    function setFloating(enabled) {

      if (enabled === isFloating) {
        return;
      }


      isFloating =
        enabled;


      if (enabled) {

        screenWrapper.classList.add(
          "floating"
        );

      } else {

        screenWrapper.classList.remove(
          "floating"
        );
      }
    }


    function setupMobilePlayerObserver() {

      if (observer) {

        observer.disconnect();

        observer = null;
      }


      setFloating(false);


      if (
        window.innerWidth >= 900 ||
        !("IntersectionObserver" in window)
      ) {

        return;
      }


      observer =
        new IntersectionObserver(
          entries => {

            const entry =
              entries[0];


            if (!entry) {
              return;
            }


            setFloating(
              !entry.isIntersecting
            );
          },
          {
            threshold: 0,
            rootMargin: "0px"
          }
        );


      observer.observe(
        screenPlaceholder
      );
    }


    setupMobilePlayerObserver();


    let lastMobileState =
      window.innerWidth < 900;


    window.addEventListener(
      "resize",
      () => {

        const mobileState =
          window.innerWidth < 900;


        if (
          mobileState !==
          lastMobileState
        ) {

          lastMobileState =
            mobileState;

          setupMobilePlayerObserver();
        }
      },
      {
        passive: true
      }
    );


    /* Categorías */

    categoryTabs.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            ".tab-btn"
          );


        if (!button) {
          return;
        }


        document
          .querySelectorAll(".tab-btn")
          .forEach(btn =>
            btn.classList.remove(
              "active"
            )
          );


        button.classList.add(
          "active"
        );


        selectedCategory =
          button.getAttribute(
            "data-category"
          ) || "TODOS";


        renderChannels();
      }
    );


    /* Búsqueda */

    searchInput.addEventListener(
      "input",
      renderChannels
    );


    /* Agregar playlist externa */

    sourceForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const url =
          sourceUrl.value.trim();


        if (!url) {
          return;
        }


        sourceButton.disabled =
          true;


        sourceStatus.textContent =
          "Cargando lista...";


        try {

          const response =
            await fetch(
              "/api/sources",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "x-user-token":
                    USER_TOKEN
                },

                body:
                  JSON.stringify({
                    url
                  })
              }
            );


          let data;


          try {

            data =
              await response.json();

          } catch (_) {

            throw new Error(
              `Respuesta inválida del servidor (HTTP ${response.status})`
            );
          }


          if (!response.ok) {

            throw new Error(
              data.error ||
              "No se pudo cargar la lista"
            );
          }


          if (
            !Array.isArray(
              data.channels
            )
          ) {

            throw new Error(
              "El servidor no devolvió canales válidos"
            );
          }


          channels =
            data.channels;


          selectedCategory =
            "TODOS";


          activeChannelId =
            channels.length
              ? channels[0].id
              : null;


          buildCategoryTabs();

          renderChannels();


          if (channels.length) {

            playChannel(
              channels[0]
            );
          }


          sourceStatus.textContent =
            `${data.message || "Lista cargada"}. Total: ${
              data.total ??
              channels.length
            } canales.`;


          sourceUrl.value = "";


        } catch (error) {

          console.error(
            "Error agregando playlist:",
            error
          );


          sourceStatus.textContent =
            error.message ||
            "No se pudo cargar la lista";

        } finally {

          sourceButton.disabled =
            false;
        }
      }
    );


    /* Auto-scroll */

    scrollToggle.addEventListener(
      "click",
      () => {

        autoScrollEnabled =
          !autoScrollEnabled;

        updateScrollButton();
      }
    );


    /*
     * Si el usuario toca/usa la lista,
     * pausamos temporalmente el auto-scroll
     * para evitar que interfiera con la
     * navegación táctil.
     */

    channelGrid.addEventListener(
      "pointerdown",
      () => {

        if (autoScrollEnabled) {

          autoScrollEnabled =
            false;

          updateScrollButton();
        }
      },
      {
        passive: true
      }
    );


    /* Inicialización */

    updateScrollButton();


    autoScrollFrame =
      window.requestAnimationFrame(
        autoScroll
      );


    initApp();

  </script>

</body>
</html>
