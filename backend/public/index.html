<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PK TV - Reproductor</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
    select, video { width: 100%; max-width: 800px; margin-top: 15px; border-radius: 8px; }
    select { padding: 10px; background: #222; color: #fff; border: 1px solid #444; }
  </style>
</head>
<body>
  <h1>Tv Personalizada</h1>
  <select id="canalSelect" onchange="cambiarCanal()">
    <option>Cargando canales...</option>
  </select>
  <br>
  <video id="video" controls autoplay></video>

  <script>
    let hls = null;

    async function cargarLista() {
      const res = await fetch('/playlist/token-secreto-123.m3u');
      const text = await res.text();
      const select = document.getElementById('canalSelect');
      select.innerHTML = '';

      const lineas = text.split('\n');
      let nombre = '';

      lineas.forEach(linea => {
        linea = linea.trim();
        if (linea.startsWith('#EXTINF:')) {
          nombre = linea.split(',')[1] || 'Canal sin nombre';
        } else if (linea.startsWith('http')) {
          const opt = document.createElement('option');
          opt.value = linea;
          opt.textContent = nombre;
          select.appendChild(opt);
        }
      });

      if (select.options.length > 0) cambiarCanal();
    }

    function cambiarCanal() {
      const url = document.getElementById('canalSelect').value;
      const video = document.getElementById('video');

      if (hls) hls.destroy();

      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
      }
    }

    cargarLista();
  </script>
</body>
</html>
